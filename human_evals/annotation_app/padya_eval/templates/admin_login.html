{% extends "base.html" %}
{% block title %}Admin{% endblock %}
{% block topnav %}{% endblock %}
{% block main_class %}page narrow{% endblock %}
{% block content %}
<section class="card login-card">
  <h1>Admin</h1>
  {% if error %}<p class="alert" role="alert">{{ error }}</p>{% endif %}
  {% if config.ADMIN_PASSWORD %}
  <form method="post" class="stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label class="field"><span>Password</span><input name="password" type="password" autocomplete="current-password" required autofocus></label>
    <button class="btn btn-primary btn-block" type="submit">Enter</button>
  </form>
  {% endif %}
</section>
{% endblock %}
