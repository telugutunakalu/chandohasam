  - date: "2026-09-13"
    run: python3 meter_engine/run_corpus.py --dataset dataset/bhagavatam.json --out meter_engine/corpus_runs/bhagavatam
    scope: all 7366 verse records of dataset/bhagavatam.json (2700 prose records skipped); 4550 poems in prāsa-bearing metres, 2816 in సీసము / తేటగీతి / ఆటవెలది / శ్లోకము
    corpus_corrections: 9-198 and 10.1-322 relabelled కందము -> ఆటవెలది before this run (dataset/CORRECTIONS.md); they were the only poems with no rhyming pair at all
    min_profile_distribution: {strict: 4398, relaxed: 142, historical: 3, none: 7}
    relaxations_used: {PRASA-MAITRI-RA-RRA-ORTHO: 70, PRASA-MAITRI-LA-LLA: 51, PRASA-MAITRI-THA-DHA: 8, PRASA-PURVAKA-04C: 6, PRASA-MAITRI-DA-DHA: 3, PRASA-MAITRI-NA-NNA: 3, PRASA-MAITRI-SA-SHA: 2, PRASA-MAITRI-RU-HALSAMYUTA: 1, PRASA-MAITRI-BINDU-SAMSLESHA: 1}
    notes:
      - >
        ర/ఱ mixing occurs in 70 poems (1.5%).  By project decision (2026-09-13) it is accepted as an
        orthographic relaxation (PRASA-MAITRI-RA-RRA-ORTHO) because printed corpora do not distinguish
        the two letters reliably; the treatise's prāsavairamu (PRASA-VAIRA-RA-RRA) is kept as a
        superseded statement and is named in the trail of every such poem.
      - >
        The seven remaining non-matches are genuine as printed: 6-523-క. (డే against ర, probably an
        edition slip), 10.1-715-క. (పైఁబడ — సరళాదేశ బ against ప), 3-616-క. (ంబు against మ),
        10.1-1009-క. (భ్రాంతి — bindu-pūrvaka త against plain త), 10.1-550-క. (ద్జ్ఞ against జ్ఞ),
        12-29-క. (ర్య against ర), 3-151-క. (pre-prāsa weight: సీరుహ straddles the pāda boundary).
      - >
        ల-ళ abhēda is the commonest treatise relaxation in the corpus (51 poems); saṁyuktākṣara prāsa
        occurs in 587 poems (368 of them geminates) and pūrṇabindu-pūrvaka prāsa in 326.
