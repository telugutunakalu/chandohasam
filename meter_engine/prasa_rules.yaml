# =============================================================================
#  EVALUATION PIPELINE — the ordered decision procedure (prasa_engine.evaluate)
# =============================================================================
evaluation_pipeline:
  - step: 1
    name: meter eligibility
    rules: [PRASA-POS-02]
    does: if a meter is named, read `prasa` from meter_rules.yaml; mark the result applicable/not; if a meter_class is exempt, skip step 7
  - step: 2
    name: syllabify each pāda
    rules: [PRASA-POS-01, PRASA-POS-08]
    does: sanitize -> aksharanusarika.split_aksharalu -> akshara_ganavibhajana; take the 1st and 2nd non-ignorable tokens
  - step: 3
    name: decompose
    rules: [PRASA-POS-06]
    does: parse both aksharas (onset / vowel / trailing signs); move a dead consonant on the 1st akshara into the onset (saṁśleṣa); record ం/ః on the 1st akshara and ఁ between the two
  - step: 4
    name: pair loop (every unordered pair of pādas)
    rules: [PRASA-POS-04]
    does: run steps 5–6 for each pair; a pair's min_profile is the least permissive profile whose accepted statuses cover every rule the match used; None when a hard failure occurred
  - step: 5
    name: signs before the prāsa akshara
    rules: [PRASA-PURVAKA-01, PRASA-DEFECT-PURNARDHABINDU, PRASA-PURVAKA-02, PRASA-PURVAKA-03, PRASA-PURVAKA-04A, PRASA-PURVAKA-04B, PRASA-PURVAKA-04C, PRASA-MAITRI-ANUNASIKA, PRASA-MAITRI-MBA-MMA, PRASA-MAITRI-BINDU-SAMSLESHA]
    does: ం asymmetry fails unless the pair is an anunāsika / ంబ-మ్మ / bindu~saṁśleṣa (ంద~న్ద) form; ః asymmetry fails; ఁ is classified (uniform / mixed-by-authority)
  - step: 6
    name: onset comparison (prasa_engine.compare_onsets), in this order
    rules_in_order:
      - PRASA-MAITRI-RU-RA            # bare ఋ vs ర
      - PRASA-REPHAYUTA-KRARAKOMMU    # C్రు vs Cృ -> fail (before any relaxation can claim it)
      - PRASA-SAMA-01                 # identical onsets (+ SAMYUKTA classifications)
      - PRASA-MAITRI-RU-HALSAMYUTA    # Cృ vs C్ర
      - PRASA-MAITRI-VIKALPA          # [N5,X] vs [S3,X]
      - element-wise maitri_table     # equal-length onsets; geminate constraint PRASA-SAMYUKTA-03 first
      - PRASA-MAITRI-SAMYUKTASAMYUKTA # [C] vs [C,ర/ల]
      - PRASA-DEFECT-ADHIKA           # one onset a proper prefix of the other
      - PRASA-SAMYUKTA-01 / -02       # conjunct vs simple / mismatched clusters -> fail
    does: the first applicable branch decides; a failing branch also appends identification notes (PRASA-DEFECT-SANTA) when the pattern fits
  - step: 6b
    name: druta-sandhi alternative reading
    rules: [PRASA-POS-07]
    does: only if the pair failed outright and a line has న్ fused before a paruṣa/sarala; re-run the pair with Xం + sarala; keep it if it matches (flag reading=druta_sandhi)
  - step: 7
    name: pre-prāsa weight rule (stanza level)
    rules: [PRASA-PURVAKSHARA-01, PRASA-PURVAKSHARA-02, PRASA-PURVAKSHARA-04]
    does: positional U/I of the 1st aksharas must be uniform; otherwise retry with intrinsic weights for lines flagged as light repha clusters (heuristic)
  - step: 8
    name: aggregate
    does: >
      matched(profile) = no hard failure in any pair, weight rule ok, and every
      rule used is accepted by the profile.  min_profile = the most permissive
      of the pair minima (None if any pair is None or the weight rule failed).
      classifications = union of pair classifications in rule order; label =
      pūrvaka prefixes + core (identity name or maitri rule label).

# =============================================================================
#  TRAIL SCHEMA — what every verdict carries (prasa_engine.PrasaResult)
# =============================================================================
trail_schema:
  result:
    profile: the profile the verdict was computed for
    matched: bool — the stanza satisfies prāsa under `profile`
    applicable: bool — false when the named meter has no prāsa
    min_profile: strict | relaxed | historical | null — least permissive profile that accepts the stanza
    would_match_under: the profile that WOULD accept it when `matched` is false and min_profile is not null
    prasa_consonant: effective onset of line 1 (e.g. త, న్వ, క్క) or the bare vowel
    label_te / label_en: composed name, e.g. "పూర్ణబిందుపూర్వక 'ద'కార ప్రాస", "స-శ ప్రాసము (ప్రాసమైత్రి)"
    classifications: "[{rule, name_te, name_en, status}] — every named prāsa the stanza exhibits"
    violations: "[{rule, scope, detail}] — under the requested profile (hard failures + relaxations the profile does not accept)"
    lines: per-line LineFeatures (see akshara_model.line_features)
    pairs: per-pair {lines, reading, rules_used, statuses_used, min_profile, hard_failures, classifications}
    trail: ordered [{rule, status, scope, detail, data}]
  trail_entry:
    rule: rule id from this file
    status: pass | fail | info | note | na
    scope: "\"line:N\" | \"pair:N-M\" | \"stanza\""
    detail: human-readable explanation naming the lines and aksharas involved
    data: machine-readable specifics (onsets, positions, weights, status, heuristic flags)

# =============================================================================
#  DIVERGENCES from the older telugu_prosody_engine tables (for the record)
# =============================================================================
divergences:
  description: >
    telugu_prosody_engine/telugu_prosody/yatiprasa.py carries a much more
    permissive PRASA_CONSONANT_GROUPS table (ఱ,ర / ల,ళ,డ,ర / ప,వ / ద,డ / క,గ / …).
    This file follows Notes/Prasa.md, which explicitly forbids several of
    those pairs; the engine's groups are therefore NOT imported.
  pairs_permitted_there_but_forbidden_here: [[ట, డ], [ద, డ], [డ, ఢ], [ర, ల], [క, ఖ], [గ, ఘ], [చ, ఛ], [ట, ఠ], [ప, ఫ], [బ, భ], [క, గ], [ప, వ], [ద, న], [బ, మ], [గ, ఙ], [జ, ఞ], [డ, ణ], [త, ద], [ప, బ], [చ, జ], [ఛ, ఝ], [జ, ఝ], [ఠ, ఢ], [ఫ, భ], [ఖ, ఘ]]
  conventions_borrowed: [PRASA-DEFECT-SANTA operational test (shared first/last consonant), identification only]
  note_on_ra_rra: the older engine's ఱ,ర group is now mirrored by PRASA-MAITRI-RA-RRA-ORTHO, but as a separately counted orthographic relaxation rather than a plain equivalence

# =============================================================================
#  ATTESTED EXAMPLES — fixtures replayed by tests/test_prasa_rules.py
# =============================================================================
#  input_kind:
#    full_padas          — complete pādas from dataset/bhagavatam.json (id given)
#    pada_initial_slice  — treatise fragment cut so the prāsa akshara is 2nd
#    synthetic           — constructed from the syllables the notes give
#  expected:
#    strict / relaxed / historical — matched under that profile
#    min_profile — least permissive accepting profile (null = never)
#    classifications_include / failing_rules_include — rule ids that must appear
#    prasa_consonant — effective onset of line 1
attested_examples:

  # ---- identity (samaprāsa) with real verses ---------------------------------
  - id: EX-SAMA-KA
    rule: PRASA-SAMA-01
    source: {text: Pōtana Bhāgavatam, dataset_id: '7-267-ఉ.', meter: ఉత్పలమాల, cited_in: '5.4 (క)'}
    input_kind: full_padas
    padas: ['లోకము లన్నియున్ గడియలోన జయించినవాఁడ వింద్రియా', 'నీకముఁ జిత్తమున్ గెలువ నేరవు నిన్ను నిబద్ధుఁ జేయు నీ', 'భీకర శత్రు లార్వురఁ బ్రభిన్నులఁ జేయుము ప్రాణికోటిలో', 'నీకు విరోధి లేఁ డొకఁడు నేర్పునఁ జూడుము దానవేశ్వరా!']
    expected: {strict: true, relaxed: true, historical: true, min_profile: strict, classifications_include: [PRASA-SAMA-01, PRASA-PURVAKSHARA-01], prasa_consonant: క}
  - id: EX-SAMA-KHA
    rule: PRASA-SAMA-01
    source: {text: Pōtana Bhāgavatam, dataset_id: '7-478-మ.', meter: మత్తేభవిక్రీడితము, cited_in: '5.4 (ఖ)'}
    input_kind: full_padas
    padas: ['అఖిలాధారుఁ డజాది దుర్లభుఁడు బ్రహ్మంబైన విష్ణుండు నీ', 'మఖమం దర్చితుఁడై నివాసగతుఁ డైమర్త్యాకృతిన్ సేవ్యుఁ డై', 'సఖియై చారకుఁ డై మనోదయితుఁ డైసంబంధి యై మంత్రి యై', 'సుఖదుండయ్యె భవన్మహామహిమ దాఁజోద్యంబు ధాత్రీశ్వరా!']
    expected: {strict: true, min_profile: strict, classifications_include: [PRASA-SAMA-01], prasa_consonant: ఖ}
  - id: EX-SAMA-THA
    rule: PRASA-SAMA-01
    source: {text: Pōtana Bhāgavatam, dataset_id: '8-70-మ.', meter: మత్తేభవిక్రీడితము, cited_in: '5.4 (థ)'}
    input_kind: full_padas
    padas: ['పృథుశక్తిన్ గజ మా జలగ్రహముతోఁబెక్కేండ్లు పోరాడి, సం', 'శిథిలంబై, తన లావు వైరిబలముంజింతించి, మిథ్యామనో', 'రథమిం కేటికి? దీని గెల్వ సరి పోరంజాలరా దంచు స', 'వ్యథమై యిట్లనుఁ బూర్వపుణ్యఫల దివ్యజ్ఞాన సంపత్తితోన్.']
    expected: {strict: true, min_profile: strict, classifications_include: [PRASA-SAMA-01], prasa_consonant: థ}
  - id: EX-SAMA-DA
    rule: PRASA-SAMA-01
