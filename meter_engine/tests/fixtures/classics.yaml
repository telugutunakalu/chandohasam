      - UIIUIUIIIUIIUIIUIUIU
      - UIIUIUIIIUIIUIIUIUIU
      - UIIUIUIIIUIIUIIUIUIU
  - id: pothana-indugaladandu
    source: Pothana, Andhra Mahabhagavatamu 7.275 (Prahlada)
    meter: kandamu
    text: |
      ఇందు గలఁ డందు లేఁ డని
      సందేహము వలదు చక్రి సర్వోపగతుం
      డెందెందు వెదకి చూచిన
      నందందే కలఁడు దానవాగ్రణి వింటే
    lines:
      - UIIIUIUII
      - UUIIIIIUIUUIIU
      - UUIIIIUII
