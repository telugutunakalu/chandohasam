stanzas:
  - id: pothana-evvanice
    source: Pothana, Andhra Mahabhagavatamu 8.73 (Gajendra moksham)
    meter: utpalamala
    note: text from dataset/bhagavatam.json (8-73-ఉ.), punctuation and arasunna as in the corpus
    text: |
      ఎవ్వనిచే జనించు జగ; మెవ్వని లోపల నుండు లీనమై;
      యెవ్వని యందు డిందుఁ; బరమేశ్వరుఁ డెవ్వఁడు; మూలకారణం
      బెవ్వఁ; డనాదిమధ్యలయుఁ డెవ్వఁడు; సర్వముఁ దానయైన వాఁ
      డెవ్వఁడు; వాని నాత్మభవు నీశ్వరు నే శరణంబు వేడెదన్.
    lines:
