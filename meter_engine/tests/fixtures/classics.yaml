  - id: vemana-uppu-kappuram
    source: Vemana satakam
    meter: ataveladi
    text: |
      ఉప్పు కప్పురంబు నొక్క పోలికనుండు
      చూడ చూడ రుచుల జాడ వేరు
      పురుషులందు పుణ్య పురుషులు వేరయా
      విశ్వదాభిరామ వినుర వేమ
