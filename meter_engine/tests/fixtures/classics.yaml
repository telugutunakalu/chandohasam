  - id: sumati-sriramuni
    source: Baddena, Sumati satakam (opening)
    meter: kandamu
    text: |
      శ్రీరాముని దయచేతను
      నారూఢిగ సకల జనులు నౌరా యనగా
      ధారాళమైన నీతులు
      నోరూరగ జవులు పుట్ట నుడివెద సుమతీ
    lines:
      - UUIIIIUII
