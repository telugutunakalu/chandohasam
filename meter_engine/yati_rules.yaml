  - {rule: YATI-UB-14, kind: hal_only, akshara_vowel: ఆ, after: "యమాన", word_prefixes: [శబ్దాయమాన, మూర్ఖాయిష్యమాణ], note: క్యచ్ -ఆయమాన}
