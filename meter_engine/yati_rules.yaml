# =============================================================================
#  yati_rules.yaml — programmable lookup table + rule catalogue for Telugu యతి
# =============================================================================
#
#  WHAT THIS FILE IS
#    The single data source read by meter_engine/yati_engine.py.  Given TWO
#    aksharas (the వళి and the akshara at the యతిస్థానము) the engine answers
#    "which yati do they satisfy, or by which named rule do they fail", with a
#    provenance trail.  The pairing rules are distilled from
#    yathi_docs/yathi_compact.md (259 one-line rules, ids YATI-<FAMILY>-<NN>),
#    itself distilled from yathi_docs/yathi.md (పద్యవిద్య ch. 6).  Every rule id
#    used here exists in yathi_compact.md with the same status (the test suite
#    checks this).
#
#  HOW TO READ IT
#    * profiles / status_vocabulary — same contract as prasa_rules.yaml
#    * alphabet          — vowel classes, consonants, vargas, phonetic classes
#    * akshara_model     — how an input string / Syllable becomes features
#    * readings          — how each coordinate is expanded into candidate
#                          readings (saṁyukta constituents, bindu variants,
#                          ఋ detachment, svara-pradhāna sandhi hypotheses,
#                          ubhaya triggers) and how readings are ranked
#    * maitri_table      — unordered consonant pairs -> rule (the lookup table)
#    * conditional_pairs — pairs that hold only in one vowel class (ము rules)
#    * bindu_table       — pairs that need a preceding anusvāra on one side
#    * cluster_unit_table— whole-cluster equivalences (జ్ఞ, స్న)
#    * vowel_bridges     — vowel <-> consonant pairings (సరస, ఋ, ఌ)
#    * sandhi_readings   — written vowel -> possible underlying vowels
#    * ubhaya_triggers   — lexical patterns that open the vowel track
#    * blockers          — lexical patterns that close a track
#    * rules             — the catalogue of operational rules (id, names, status)
#    * evaluation_pipeline / trail_schema
#    * attested_examples — fixtures replayed by tests/test_yati_rules.py
#
#  RULE ID GRAMMAR (shared with yathi_docs)
#    YATI-<FAMILY>-<NN>[.<k>]   POS MOD SV VY SY SP UB PY DL RJ EP
# =============================================================================

schema_version: 1

metadata:
  title: Telugu యతి (yati) pair lookup table and rule catalogue
  source: yathi_docs/yathi_compact.md
  source_detail: yathi_docs/rules/*.md (bullets) <- yathi_docs/yathi.md (పద్యవిద్య ch. 6, 20 parts)
  compiled_on: "2026-09-14"
  engine: meter_engine/yati_engine.py
  companion: meter_engine/prasa_rules.yaml (prāsa-yati fallback reuses prasa_engine.lookup_pair)
  related_files:
    - meter_engine/meter_rules.yaml      # yati positions per meter, prasa_yati flag
    - meter_engine/indic_meter_dawg/     # scansion.Syllable and parser.Segmentation.yati_aksharas feed evaluate_line

profile_order: [strict, relaxed, historical]

profiles:
  strict:
    label_en: Strict — Appakavi / Kavitraya canon
    label_te: కఠిన
    accepted_statuses: [canonical, canonical_subtype, mandatory, informational]
  relaxed:
    label_en: Relaxed — later lākṣaṇikas and kāvya usage (ర-ల, ద-డ generalised, స్నా-త, విశ్వామిత్ర vowel) + ర/ఱ orthographic relaxation
    label_te: సడలింపు
    accepted_statuses: [canonical, canonical_subtype, mandatory, informational, accepted_relaxation, orthographic_relaxation]
  historical:
    label_en: Historical — additionally IDENTIFY deprecated forms (బహుయతి lapses, prāsa-yati variants); forbidden still fails
    label_te: చారిత్రక
    accepted_statuses: [canonical, canonical_subtype, mandatory, informational, accepted_relaxation, orthographic_relaxation, deprecated]

status_vocabulary:
  canonical: core rule; every profile applies it
  canonical_subtype: named sub-variety; every profile applies it
  mandatory: constraint whose violation fails every profile
  accepted_relaxation: sanctioned by later lākṣaṇikas / usage; needs profile >= relaxed
  orthographic_relaxation: ర/ఱ — forbidden by the early canon, not distinguished by printed corpora; accepted from relaxed on (project decision, same as prāsa)
  deprecated: attested but apraśasta; identified only in the historical profile
  forbidden: never a match; the rule names the failure
  informational: annotation only

# -----------------------------------------------------------------------------
alphabet:
  vowel_classes:                      # YATI-SV-01 — every rule presupposes this
    A: [అ, ఆ, ఐ, ఔ]
    I: [ఇ, ఈ, ఋ, ౠ, ఌ, ౡ, ఎ, ఏ]
    U: [ఉ, ఊ, ఒ, ఓ]
  matras: {"ా": ఆ, "ి": ఇ, "ీ": ఈ, "ు": ఉ, "ూ": ఊ, "ృ": ఋ, "ౄ": ౠ, "ౢ": ఌ, "ౣ": ౡ, "ె": ఎ, "ే": ఏ, "ై": ఐ, "ొ": ఒ, "ో": ఓ, "ౌ": ఔ}
  consonants: [క, ఖ, గ, ఘ, ఙ, చ, ఛ, జ, ఝ, ఞ, ట, ఠ, డ, ఢ, ణ, త, థ, ద, ధ, న, ప, ఫ, బ, భ, మ, య, ర, ఱ, ల, ళ, వ, శ, ష, స, హ]
  dantya_map: {ౘ: చ, ౙ: జ}           # savarṇa (Bāla Vyākaraṇam Saṁjñā 7); YATI-VY-02.1 / YATI-VY-12.1
  vargas:
    - {name: ka, members: [క, ఖ, గ, ఘ, ఙ]}
    - {name: ca, members: [చ, ఛ, జ, ఝ, ఞ]}
    - {name: ṭa, members: [ట, ఠ, డ, ఢ, ణ]}
    - {name: ta, members: [త, థ, ద, ధ, న]}
    - {name: pa, members: [ప, ఫ, బ, భ, మ]}
  classes:
    stops: [క, ఖ, గ, ఘ, చ, ఛ, జ, ఝ, ట, ఠ, డ, ఢ, త, థ, ద, ధ, ప, ఫ, బ, భ]
    nasal: [ఙ, ఞ, ణ, న, మ]
    sibilant: [శ, ష, స]
    semivowel: [య, ర, ల, వ]
    mavarna_hosts: [య, ర, ల, వ, శ, ష, స, హ]   # YATI-SP-03: ం + these <-> మ
    labial_stops: [ప, ఫ, బ, భ]                 # YATI-VY-16/17, YATI-DL-06

# -----------------------------------------------------------------------------
akshara_model:
  input_forms:
    - a Telugu akshara string, e.g. "క", "గా", "శ్రీ", "క్ష్మా"
    - the same string with a LEADING "ం" meaning "the preceding akshara carries an anusvāra" (ంత, ండ) -> pre_bindu
    - the same string with a LEADING dead consonant meaning "fused with the preceding drutam / pollu" (న్సా, ల్గీ) -> pre_dead + onset
    - an indic_meter_dawg.scansion.Syllable (or any object with .onset .vowel .anusvara .visarga .dead .candrabindu)
  normalisation:                      # YATI-EP-02
    - NFC; ౝ -> న్; drop ఽ, ZW chars, length marks
    - ఁ (ardhabindu) is dropped: no effect on yati (YATI-MOD-01)
    - ం / ః ON the akshara are recorded but ignored for pairing (YATI-MOD-02, YATI-MOD-04)
    - a trailing dead consonant on the akshara is ignored for pairing (YATI-MOD-05)
    - a preceding ం (pre_bindu) is a FLAG that adds pairs (YATI-MOD-03); a preceding dead న్/ల్ joins the onset (YATI-MOD-06, YATI-SY-08/09)
    - ౘ/ౙ are normalised to చ/జ for pairing (savarṇa)

# -----------------------------------------------------------------------------
readings:
  description: >
    Each coordinate is expanded into candidate readings (YATI-EP-03).  A reading is
    (track, consonant|None, vowel, bindu, via, rank).  Lower rank = closer to the
    written text; the best accepted match is the one with the lowest combined rank.
  ranks:
    0: written reading — first onset consonant + vowel, or the bare vowel
    1: another onset constituent (YATI-SY-01), a geminate (YATI-SY-03), a bindu variant (YATI-VY-03), a fused pre_dead constituent (YATI-SY-08/09), a confirmed sandhi split supplied by the caller (YATI-SV-02)
    2: ఋ / ఌ detachment (YATI-SV-05/06/07, YATI-DL-01) and cluster-unit equivalences (జ్ఞ, స్న)
    3: ubhaya vowel opened by a lexical trigger (YATI-UB-*)
    4: svara-pradhāna sandhi hypothesis from the written vowel alone (YATI-SV-02.2), drutam న+V and యడాగమ readings
    5: hidden-vowel hypotheses — గూఢస్వర అ under ఓ/ఏ (YATI-SV-04), వృద్ధి option B (YATI-SV-08)
  sandhi_modes:
    "off": no hypotheses of rank 4/5 (only readings the text or the caller establishes)
    hypothesis: default — rank 4/5 readings are generated and reported as hypotheses; at most ONE side may be a hypothesis
    acchu: hypothesis + the vowel-only path (YATI-SV-02.10) — both sides may be hypotheses, so any two same-class vowels pair (telugu_prosody_engine's experimental_sandhi; markedly permissive)
    confirmed: the caller supplies the underlying vowel(s) (vowel_a / vowel_b); they get rank 1

# -----------------------------------------------------------------------------
#  THE LOOKUP TABLE: unordered consonant pairs -> rule.  Identity -> YATI-VY-01.
#  Every pair also needs the two vowels in one class (YATI-SV-01.1), except
#  where a rule says otherwise.  Pairs not listed and not identical -> no yati
#  (named YATI-RJ-00 "no maitri").
# -----------------------------------------------------------------------------
maitri_table:
  symmetric: true
  identity_rule: YATI-VY-01
  default_rule: YATI-RJ-00
  vargaja_rule: YATI-VY-02.1          # generated: all pairs among positions 1-4 of each varga (39 pairs incl. ౘ/ౙ folded into చ/జ)
  pairs:
    # న-ణ, ఋజు, ఊష్మ
    - {consonants: [న, ణ], rule: YATI-VY-04}
    - {consonants: [య, హ], rule: YATI-VY-08}
    - {consonants: [శ, ష], rule: YATI-VY-11}
    - {consonants: [శ, స], rule: YATI-VY-11}
    - {consonants: [ష, స], rule: YATI-VY-11}
    # సరసయతి-4: sibilants with palatals (18 pairs)
    - {consonants: [శ, చ], rule: YATI-VY-12}
    - {consonants: [శ, ఛ], rule: YATI-VY-12}
    - {consonants: [శ, జ], rule: YATI-VY-12}
    - {consonants: [శ, ఝ], rule: YATI-VY-12}
    - {consonants: [ష, చ], rule: YATI-VY-12}
    - {consonants: [ష, ఛ], rule: YATI-VY-12}
    - {consonants: [ష, జ], rule: YATI-VY-12}
    - {consonants: [ష, ఝ], rule: YATI-VY-12}
    - {consonants: [స, చ], rule: YATI-VY-12}
    - {consonants: [స, ఛ], rule: YATI-VY-12}
    - {consonants: [స, జ], rule: YATI-VY-12}
    - {consonants: [స, ఝ], rule: YATI-VY-12}
    # అభేద, అభేదవర్గ, ల-ళ
    - {consonants: [వ, బ], rule: YATI-VY-13}
    - {consonants: [వ, ప], rule: YATI-VY-14}
    - {consonants: [వ, ఫ], rule: YATI-VY-14}
    - {consonants: [వ, భ], rule: YATI-VY-14}
    - {consonants: [ల, ళ], rule: YATI-VY-15}
    # late / derived (profile >= relaxed)
    - {consonants: [ర, ఱ], rule: YATI-SP-08}
    - {consonants: [ల, డ], rule: YATI-DL-04}
    - {consonants: [ళ, డ], rule: YATI-DL-04}
    - {consonants: [ద, డ], rule: YATI-DL-05}
    - {consonants: [ర, ల], rule: YATI-DL-02}
    - {consonants: [ర, ళ], rule: YATI-DL-02.1}
    # explicitly forbidden (named in the trail)
    - {consonants: [ల, ఢ], rule: YATI-RJ-13}
    - {consonants: [ళ, ఢ], rule: YATI-RJ-13}
    - {consonants: [ధ, డ], rule: YATI-RJ-14}
    - {consonants: [ద, ఢ], rule: YATI-RJ-14}
    - {consonants: [త, డ], rule: YATI-RJ-14}
    - {consonants: [మ, వ], rule: YATI-RJ-07}
    - {consonants: [య, ర], rule: YATI-RJ-06}
    - {consonants: [య, ల], rule: YATI-RJ-06}
    - {consonants: [య, వ], rule: YATI-RJ-06}
    - {consonants: [ర, వ], rule: YATI-RJ-06}
    - {consonants: [ల, వ], rule: YATI-RJ-06}
    - {consonants: [శ, హ], rule: YATI-RJ-06}
    - {consonants: [ష, హ], rule: YATI-RJ-06}
    - {consonants: [స, హ], rule: YATI-RJ-06}
  # stop (1-4) with the nasal (5) of its own varga WITHOUT a preceding bindu -> named failure
  stop_nasal_without_bindu_rule: YATI-RJ-05

# pairs that hold only when BOTH vowels are in the named class (override the table / forbidden entries)
conditional_pairs:
  - {consonants: [మ, ప], vowel_class: U, rule: YATI-VY-16, note: ము (suffix) or stem ము (YATI-VY-17) <-> పు-series}
  - {consonants: [మ, ఫ], vowel_class: U, rule: YATI-VY-16}
  - {consonants: [మ, బ], vowel_class: U, rule: YATI-VY-16}
  - {consonants: [మ, భ], vowel_class: U, rule: YATI-VY-16}
  - {consonants: [మ, వ], vowel_class: U, rule: YATI-DL-06, note: ము-వు; overrides YATI-RJ-07 in the U class}

# preceding-anusvāra pairs: `bindu_side` consonants carry pre_bindu; `other` has none unless both: true
bindu_table:
  - {rule: YATI-VY-03, bindu_side: [క, ఖ, గ, ఘ], other: [ఙ]}
  - {rule: YATI-VY-03, bindu_side: [చ, ఛ, జ, ఝ], other: [ఞ]}
  - {rule: YATI-VY-03, bindu_side: [ట, ఠ, డ, ఢ], other: [ణ]}
  - {rule: YATI-VY-03, bindu_side: [త, థ, ద, ధ], other: [న]}
  - {rule: YATI-VY-03, bindu_side: [ప, ఫ, బ, భ], other: [మ]}
  - {rule: YATI-VY-05, bindu_side: [ట, ఠ, డ, ఢ], other: [న]}
  - {rule: YATI-VY-05, bindu_side: [త, థ, ద, ధ], other: [ణ]}
  - {rule: YATI-VY-06, bindu_side: [ట, ఠ, డ, ఢ], other: [త, థ, ద, ధ], both: true}
  - {rule: YATI-SP-03, bindu_side: [య, ర, ల, వ, శ, ష, స, హ], other: [మ]}

# whole-cluster equivalences: an onset equal to `cluster` may be read as each `as` consonant
cluster_unit_table:
  - {cluster: [జ, ఞ], as: [న, ణ], rule: YATI-SP-01}
  - {cluster: [జ, ఞ], as: [క, ఖ, గ, ఘ], rule: YATI-SP-02}
  - {cluster: [స, న], vowel: ఆ, as: [త, థ, ద, ధ], rule: YATI-DL-09, note: the word స్నాన; accepted_relaxation}

# vowel <-> consonant bridges (the only cases where a vowel pairs with a consonant)
vowel_bridges:
  - {rule: YATI-VY-09, consonant: య, vowel_classes: [A, I, U], note: సరసయతి-2; only a శబ్దసిద్ధ య (YATI-VY-09.1)}
  - {rule: YATI-VY-10, consonant: హ, vowel_classes: [A, I, U], note: సరసయతి-3}
  - {rule: YATI-SV-05, vowel: ఋ, consonant: ర, consonant_vowel_class: I, note: ఋ <-> రి రీ రె రే; host consonant of a bound ఋ ignored}
  - {rule: YATI-SV-05.5, vowel: ఋ, consonant: ఱ, consonant_vowel_class: I, note: orthographic_relaxation}
  - {rule: YATI-DL-01, vowel: ఌ, consonant: ల, consonant_vowel_class: I}
  - {rule: YATI-DL-01, vowel: ఌ, consonant: ళ, consonant_vowel_class: I}
  # named failures for vowel-vs-consonant attempts
  - {rule: YATI-RJ-08, vowel_class: U, consonant: వ, consonant_vowel_class: U, forbidden: true, note: ఉ-వు}
  - {rule: YATI-RJ-10, vowel: ఋ, consonant: ర, consonant_vowel_class: U, forbidden: true, note: ఋ-రు}
  - {rule: YATI-RJ-12, vowel: ఋ, consonant: ల, consonant_vowel_class: I, forbidden: true, note: ఋ-లి}

# ఋ / ఌ detachment (YATI-SV-05.4: the only vowels allowed to leave their host consonant)
detachable_vowels:
  ఋ: {bare_vs_bound: YATI-SV-06, bound_vs_bound: YATI-SV-07, bound_vs_ra_I: YATI-SV-05.2, bare_vs_ra_I: YATI-SV-05, bare_vs_bare: YATI-SV-03.1}
  ౠ: {bare_vs_bound: YATI-SV-06, bound_vs_bound: YATI-SV-07, bound_vs_ra_I: YATI-SV-05.2, bare_vs_ra_I: YATI-SV-05, bare_vs_bare: YATI-SV-03.1}
  ఌ: {bare_vs_bound: YATI-DL-01, bound_vs_bound: YATI-DL-01, bound_vs_ra_I: YATI-DL-01, bare_vs_ra_I: YATI-DL-01, bare_vs_bare: YATI-SV-01}

# svara-pradhāna hypotheses: written vowel -> [underlying vowel, rule, rank]
sandhi_readings:
  ఆ: [[అ, YATI-SV-02, 4], [ఆ, YATI-SV-02, 4]]                  # సవర్ణదీర్ఘ, ఆ-initial word
  ఏ: [[ఇ, YATI-SV-02, 4], [ఈ, YATI-SV-02, 4], [ఎ, YATI-SV-02, 4], [ఏ, YATI-SV-02, 4], [అ, YATI-SV-04.4, 5]]   # గుణ, ఉత్వ+ఎ, పూర్వరూప
  ఓ: [[ఉ, YATI-SV-02, 4], [ఊ, YATI-SV-02, 4], [ఒ, YATI-SV-02, 4], [ఓ, YATI-SV-02, 4], [అ, YATI-SV-04, 5]]     # గుణ, ఉత్వ+ఒ, గూఢస్వర
  ఐ: [[ఐ, YATI-SV-02, 4], [ఏ, YATI-SV-08, 5]]                  # ఇత్వ+ఐ; వృద్ధి option B
  ఔ: [[ఔ, YATI-SV-02, 4], [ఓ, YATI-SV-08, 5]]
  అ: [[అ, YATI-SV-02, 4]]                                     # అత్వ sandhi (ఉన్న+అప్పుడు), జశ్త్వ, విసర్గ
  ఇ: [[ఇ, YATI-SV-02, 4]]
  ఈ: [[ఈ, YATI-SV-02, 4]]
  ఉ: [[ఉ, YATI-SV-02, 4]]
  ఊ: [[ఊ, YATI-SV-02, 4]]
  ఎ: [[ఎ, YATI-SV-02, 4]]
  ఒ: [[ఒ, YATI-SV-02, 4]]
  ఋ: [[ఋ, YATI-SV-03.2, 4]]
  # onset-specific: a lone న (drutam+V) and a lone య (యడాగమ+V) are vowel readings too (YATI-SV-02.2); handled in code with the same rank 4

# lexical triggers that open the vowel track (ubhaya) — heuristic, pattern over the WORD containing the akshara
ubhaya_triggers:
  suffix:
    - {rule: YATI-UB-01, akshara_vowel: ఇ, akshara_anusvara: true, after: "చ", vowel: ఇ, note: -ఇంచు (ధరించు, పోషించి); the trigger akshara carries ఇం and is followed by చ/ప}
    - {rule: YATI-UB-01, akshara_vowel: ఇ, akshara_anusvara: true, after: "ప", vowel: ఇ, note: -ఇంప (ఉపమింపఁగ)}
    - {rule: YATI-UB-02, akshara_vowel: ఏ, after: "ని", vowel: ఏ, note: -ఏని}
    - {rule: YATI-UB-03, akshara_vowel: ఏ, after: "సి", vowel: ఏ, note: -ఏసి}
    - {rule: YATI-UB-04, akshara_vowel: ఎ, after: "ఁడు", vowel: ఎ, note: -ఎఁడు (measure)}
    - {rule: YATI-UB-19, akshara: "కై", vowel: ఐ, note: dative కై; also అ via కయి}
  ordinal:                            # YATI-UB-05: the akshara before వ in these words -> అ
    words: [రెండవ, మూడవ, మూఁడవ, నాలవ, నాలుగవ, ఐదవ, అయిదవ, ఆరవ, ఏడవ, ఎనిమిదవ, తొమ్మిదవ, పదవ, పదునొకండవ, పండ్రెండవ, పదుమూఁడవ]
    rule: YATI-UB-05
    vowel: అ
  prefix:                             # YATI-UB-10.7: word starts with the fused form; the junction akshara (index) -> vowels
    - {rule: YATI-UB-10, form: ప్రా, index: 0, vowels: [అ, ఆ]}
    - {rule: YATI-UB-10, form: ప్రో, index: 0, vowels: [ఉ, ఊ]}
    - {rule: YATI-UB-10, form: ప్రే, index: 0, vowels: [ఇ, ఈ]}
    - {rule: YATI-UB-10, form: పరా, index: 1, vowels: [అ]}
    - {rule: YATI-UB-10, form: పలా, index: 1, vowels: [అ]}
    - {rule: YATI-UB-10, form: పరే, index: 1, vowels: [ఇ]}
    - {rule: YATI-UB-10, form: పరో, index: 1, vowels: [ఊ]}
    - {rule: YATI-UB-10, form: అపా, index: 1, vowels: [అ]}
    - {rule: YATI-UB-10, form: అపే, index: 1, vowels: [ఇ, ఈ]}
    - {rule: YATI-UB-10, form: అపో, index: 1, vowels: [ఊ]}
    - {rule: YATI-UB-10, form: సమ, index: 1, vowels: [అ]}
    - {rule: YATI-UB-10, form: సమా, index: 1, vowels: [ఆ]}
