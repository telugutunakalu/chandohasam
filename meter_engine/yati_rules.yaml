evaluation_pipeline:
  - {step: 1, fn: parse_akshara, rule: YATI-EP-02, does: normalise the two inputs into Akshara features (pre_bindu, pre_dead, onset, vowel, marks)}
  - {step: 2, fn: readings_for, rule: YATI-EP-03, does: expand each coordinate into ranked readings (written, saṁyukta constituents, bindu variants, ఋ detachment, cluster units, ubhaya triggers, sandhi hypotheses); apply blockers (YATI-EP-03.1)}
  - {step: 3, fn: pair_rule, rule: YATI-EP-04, does: for every reading pair look up the bhēda rule (svara class / maitri table / bindu table / vowel bridges / detachment) and check the vowel classes}
  - {step: 4, fn: rank, does: keep every candidate; the best is the accepted one with the lowest (rank_a + rank_b); named failures are kept as `rejected`}
  - {step: 5, fn: evaluate_line, rule: YATI-EP-07, does: per yati group; bahu-yati consistency; prāsa-yati fallback (YATI-EP-08) when the meter permits and head yati fails}

trail_schema:
  entry: {rule: rule id, outcome: pass|fail|info, detail: human-readable, data: machine-readable}
  result: {matched: bool, best: Match|null, candidates: [Match], rejected: [Match], min_profile: str|null, why: str}
  match: {rule, status, label_te, reading_a, reading_b, vidhana: [ids], rank, hypothesis: bool}

