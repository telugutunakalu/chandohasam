- id: 20
  name: kandamu
  padalu: 4
  no_of_ganas: [3, 5, 3, 5]
  aksharalu: {min: 6, max: 20}
  ganalu: 1,3 పాదాలలో 3 గణములు; 2,4 పాదాలలో 5 గణములు (భ,జ,స,నల,గా మాత్రమే)
  gana_type: variable
  yati_exists: true
  yati_type: ganayati
  yati:
  - [0, 0]
  - [1, 4]
  - [0, 0]
  - [1, 4]
  prasa: true
  prasa_yati: false
  udaharana: భూథలనాథుఁడు రాముఁడు ప్రీతుండై పెండ్లియాడెఁ బృథుగుణమణి సంఘాతన్ భాగ్యోపేతన్ సీతన్ ముఖకాంతివిజిత సితఖద్యోతన్.
  structure:
    system: gana
    slots:
      odd: [kanda, kanda, kanda]
      even: [kanda, kanda, kanda, kanda, kanda]
    slot_pattern: [odd, even, odd, even]
    yati_ganas:
      odd: []
      even: [4]
    constraints:
    - rule: forbid_gana
      slot: odd
      positions: [1, 3]
      gana: జ
      why: జగణము బేసి గణములలో (1,3,5,7) రాకూడదు
    - rule: forbid_gana
      slot: even
      positions: [2, 4]
      gana: జ
      why: జగణము బేసి గణములలో (1,3,5,7) రాకూడదు — even line ganas 2,4 are half-ganas 5,7
    - rule: require_gana
      slot: even
      positions: [3]
      gana: [జ, నల]
      why: ఆరవ గణము జగణము లేదా నలము
    - {rule: line_ends_with, slot: even, weight: U, why: పాదాంతమున (అర్ధభాగాంతమున) గురువు}
    stanza_constraints:
    - {rule: first_akshara_weight_uniform, why: 'మొదటి అక్షరము గురువైన అన్ని పాదములలో గురువు, లఘువైన లఘువు — verify against
        Appakaviyamu'}
